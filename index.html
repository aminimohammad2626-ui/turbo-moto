<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TURBO MOTO — 3D Bike Racing</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0e16; font-family:'Segoe UI', Arial, sans-serif; }
  #game { position:fixed; inset:0; }
  canvas { display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; display:none; }
  .panel {
    background:linear-gradient(135deg, rgba(10,16,28,.82), rgba(10,16,28,.55));
    border:1px solid rgba(120,180,255,.25); border-left:4px solid #ff6a00;
    border-radius:10px; padding:12px 16px; color:#fff;
    box-shadow:0 6px 24px rgba(0,0,0,.45); backdrop-filter:blur(4px);
  }
  #topLeft { position:absolute; top:16px; left:16px; min-width:190px; }
  #posBig { font-size:44px; font-weight:900; font-style:italic; line-height:1; color:#ffd23f; text-shadow:0 0 14px rgba(255,210,63,.5); }
  #posBig span { font-size:20px; color:#8fa3bf; }
  #lapLine { font-size:16px; font-weight:700; margin-top:6px; letter-spacing:1px; }
  #lapLine b { color:#33e6ff; }
  #timeLine { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:4px; }
  #bestLine { font-size:12px; color:#8fa3bf; font-variant-numeric:tabular-nums; margin-top:2px; }
  #lastLine { font-size:12px; color:#8fa3bf; font-variant-numeric:tabular-nums; }

  #minimap { position:absolute; top:16px; right:16px; width:190px; height:190px;
    background:rgba(10,16,28,.6); border:1px solid rgba(120,180,255,.25); border-radius:12px; }

  #speedoWrap { position:absolute; right:14px; bottom:14px; width:200px; text-align:center; }
  #speedo { width:200px; height:200px; filter:drop-shadow(0 6px 18px rgba(0,0,0,.5)); }
  #gearBox { position:absolute; left:-64px; bottom:24px; width:56px; height:56px; border-radius:12px;
    background:rgba(10,16,28,.78); border:1px solid rgba(120,180,255,.3);
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #gearNum { font-size:26px; font-weight:900; font-style:italic; color:#33e6ff; line-height:1; }
  .gearLabel { font-size:9px; font-weight:800; letter-spacing:2px; color:#8fa3bf; }
  #nitroBar { width:150px; height:10px; margin:-24px auto 0; background:rgba(255,255,255,.12);
    border-radius:6px; overflow:hidden; border:1px solid rgba(120,180,255,.3); }
  #nitroFill { height:100%; width:100%; background:linear-gradient(90deg,#33e6ff,#7c4dff);
    border-radius:6px; transition:width .08s linear; }
  .nitroLabel { font-size:10px; font-weight:800; letter-spacing:3px; color:#8fa3bf; margin-top:4px; }

  #centerMsg { position:absolute; top:26%; left:50%; transform:translateX(-50%);
    font-size:34px; font-weight:900; font-style:italic; color:#fff; letter-spacing:2px;
    text-shadow:0 0 24px rgba(51,230,255,.8), 0 2px 6px #000; opacity:0; transition:opacity .3s; white-space:nowrap; }
  #countdown { position:absolute; top:32%; left:50%; transform:translate(-50%,-50%);
    font-size:130px; font-weight:900; font-style:italic; color:#ffd23f;
    text-shadow:0 0 40px rgba(255,210,63,.7), 0 4px 12px #000; display:none; }
  #wrongWay { position:absolute; top:14%; left:50%; transform:translateX(-50%);
    font-size:30px; font-weight:900; color:#ff3b3b; text-shadow:0 0 20px rgba(255,59,59,.7), 0 2px 4px #000;
    display:none; animation:blink .5s infinite; }
  @keyframes blink { 50% { opacity:.25; } }

  #topBtns { position:absolute; top:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; pointer-events:auto; }
  #topBtns button {
    background:rgba(10,16,28,.7); color:#cfe3ff; border:1px solid rgba(120,180,255,.35);
    border-radius:8px; padding:6px 12px; font-size:13px; font-weight:700; cursor:pointer; }
  #topBtns button:hover { background:rgba(40,60,100,.8); }

  .overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(12,20,38,.88), rgba(4,6,12,.96)); }
  .hidden { display:none !important; }
  .title { font-size:min(9vw,84px); font-weight:900; font-style:italic; letter-spacing:2px;
    background:linear-gradient(90deg,#ff6a00,#ffd23f,#33e6ff); -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 30px rgba(255,140,0,.35)); }
  .subtitle { color:#8fa3bf; font-size:15px; letter-spacing:6px; margin:8px 0 34px; font-weight:600; }
  .bigBtn {
    pointer-events:auto; cursor:pointer; border:none; border-radius:12px; padding:16px 58px;
    font-size:22px; font-weight:900; font-style:italic; letter-spacing:2px; color:#0a0e16;
    background:linear-gradient(90deg,#ffd23f,#ff6a00);
    box-shadow:0 8px 30px rgba(255,120,0,.4); transition:transform .12s, box-shadow .12s; }
  .bigBtn:hover { transform:translateY(-2px) scale(1.03); box-shadow:0 12px 40px rgba(255,120,0,.6); }
  .controls { margin-top:34px; color:#aab8cc; font-size:14px; line-height:2; text-align:center; }
  .controls b { color:#fff; background:rgba(120,180,255,.12); border:1px solid rgba(120,180,255,.3);
    border-radius:6px; padding:2px 9px; margin:0 3px; font-family:monospace; }
  #bestMenu { margin-top:18px; color:#ffd23f; font-size:14px; font-weight:700; letter-spacing:1px; }

  #results { margin:20px 0 30px; min-width:340px; }
  .resRow { display:flex; justify-content:space-between; gap:30px; padding:9px 18px;
    border-radius:8px; color:#cfe3ff; font-size:16px; font-weight:600; }
  .resRow.me { background:linear-gradient(90deg, rgba(255,106,0,.25), rgba(255,210,63,.12)); border:1px solid rgba(255,140,0,.5); color:#fff; }
  .resRow .t { font-variant-numeric:tabular-nums; color:#8fa3bf; }
  .resRow.me .t { color:#ffd23f; }
  .resHead { font-size:34px; font-weight:900; font-style:italic; color:#fff; letter-spacing:2px; }

  #touchUI { position:fixed; inset:0; z-index:6; pointer-events:none; }
  .tbtn { position:absolute; pointer-events:auto; width:76px; height:76px; border-radius:50%;
    background:rgba(20,30,50,.55); border:2px solid rgba(120,180,255,.4); color:#fff;
    font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  .tbtn:active { background:rgba(255,140,0,.5); }
  #tLeft { left:22px; bottom:36px; } #tRight { left:116px; bottom:36px; }
  #tGas { right:22px; bottom:36px; } #tBrake { right:116px; bottom:36px; }
  #tNitro { right:60px; bottom:130px; border-color:rgba(124,77,255,.7); }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div id="topLeft" class="panel">
    <div id="posBig">6<span>/6</span></div>
    <div id="lapLine">LAP <b id="lapNum">1</b>/3</div>
    <div id="timeLine">00:00.000</div>
    <div id="lastLine">LAST --:--.---</div>
    <div id="bestLine">BEST --:--.---</div>
  </div>
  <canvas id="minimap" width="190" height="190"></canvas>
  <div id="speedoWrap">
    <div id="gearBox"><div id="gearNum">N</div><div class="gearLabel">GEAR</div></div>
    <canvas id="speedo" width="200" height="200"></canvas>
    <div id="nitroBar"><div id="nitroFill"></div></div>
    <div class="nitroLabel">NITRO</div>
  </div>
  <div id="centerMsg"></div>
  <div id="countdown">3</div>
  <div id="wrongWay">&#9888; WRONG WAY</div>
  <div id="topBtns">
    <button id="muteBtn">&#128266; SOUND</button>
    <button id="camBtn">&#127909; CAMERA</button>
  </div>
</div>

<div id="menu" class="overlay">
  <div class="title">TURBO MOTO</div>
  <div class="subtitle">3D GRAND PRIX RACING</div>
  <button class="bigBtn" id="startBtn">&#9654; START RACE</button>
  <div class="controls">
    <b>W / &#8593;</b> Accelerate &nbsp; <b>S / &#8595;</b> Brake &nbsp; <b>A D / &#8592; &#8594;</b> Steer<br>
    <b>SHIFT</b> Nitro &nbsp; <b>C</b> Camera &nbsp; <b>R</b> Reset bike &nbsp; <b>M</b> Mute &nbsp; <b>ESC</b> Pause
  </div>
  <div id="bestMenu"></div>
</div>

<div id="pauseOverlay" class="overlay hidden">
  <div class="resHead">PAUSED</div>
  <button class="bigBtn" id="resumeBtn" style="margin-top:26px;">RESUME</button>
</div>

<div id="finishOverlay" class="overlay hidden">
  <div class="resHead" id="finishTitle">RACE FINISHED</div>
  <div id="results"></div>
  <button class="bigBtn" id="restartBtn">&#8635; RACE AGAIN</button>
</div>

<div id="fatal" class="overlay hidden" style="z-index:99;">
  <div class="resHead" style="color:#ff3b3b;">ERROR</div>
  <div id="fatalMsg" style="color:#cfe3ff; margin:18px; text-align:center; max-width:520px; font-size:15px; line-height:1.8;"></div>
</div>

<div id="touchUI" class="hidden">
  <div class="tbtn" id="tLeft">&#9664;</div>
  <div class="tbtn" id="tRight">&#9654;</div>
  <div class="tbtn" id="tGas">GAS</div>
  <div class="tbtn" id="tBrake">BRAKE</div>
  <div class="tbtn" id="tNitro">N2O</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
window.addEventListener('error', function (e) {
  var el = document.getElementById('fatal');
  if (el) {
    el.classList.remove('hidden');
    document.getElementById('fatalMsg').textContent =
      (e && e.message ? e.message : 'Unknown error') +
      ' — Please make sure you are using an up-to-date browser and internet connection, then reload the page.';
  }
});
</script>
<script>

if (typeof THREE === 'undefined') {
  document.getElementById('fatal').classList.remove('hidden');
  document.getElementById('fatalMsg').textContent =
    'Could not load the 3D engine (three.js). Check your internet connection and reload the page.';
  throw new Error('three.js failed to load');
}

/* ============================================================
   RENDERER / SCENE / LIGHTING
============================================================ */
const container = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const SKY = 0x8ec9ef;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(SKY, 220, 900);
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2500);

/* environment map for reflections (paint & chrome) */
(function buildEnvironment() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new THREE.Scene();
  const gradCanvas = document.createElement('canvas');
  gradCanvas.width = 4; gradCanvas.height = 256;
  const g = gradCanvas.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#1e5fc4'); grad.addColorStop(0.55, '#8ec9ef'); grad.addColorStop(1, '#dceef8');
  g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
  env.add(new THREE.Mesh(
    new THREE.SphereGeometry(50, 16, 12),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(gradCanvas), side: THREE.BackSide })
  ));
  const sunBall = new THREE.Mesh(new THREE.SphereGeometry(4, 12, 8),
    new THREE.MeshBasicMaterial({ color: 0xfff4d6 }));
  sunBall.position.set(20, 30, 10);
  env.add(sunBall);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120),
    new THREE.MeshBasicMaterial({ color: 0x4a6b3a }));
  floor.rotation.x = -Math.PI / 2;
  env.add(floor);
  scene.environment = pmrem.fromScene(env, 0.04).texture;
  pmrem.dispose();
})();

const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x4a7d3f, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2d8, 2.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 400;
sun.shadow.bias = -0.0004;
scene.add(sun); scene.add(sun.target);

/* sky dome */
(function makeSky() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#1e5fc4'); grad.addColorStop(0.55, '#7dbdea'); grad.addColorStop(1, '#e8f4fa');
  g.fillStyle = grad; g.fillRect(0, 0, 4, 256);
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(1400, 24, 16),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.BackSide, fog: false })
  );
  scene.add(sky);
})();

/* distant mountains */
(function makeMountains() {
  const mat = new THREE.MeshStandardMaterial({ color: 0x7d9080, roughness: 1, flatShading: true });
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + Math.random() * 0.3;
    const r = 620 + Math.random() * 180;
    const h = 90 + Math.random() * 150;
    const m = new THREE.Mesh(new THREE.ConeGeometry(90 + Math.random() * 130, h, 6), mat);
    m.position.set(Math.cos(a) * r, h / 2 - 12, 70 + Math.sin(a) * r);
    m.rotation.y = Math.random() * Math.PI;
    scene.add(m);
  }
})();

/* ============================================================
   TRACK (closed spline with elevation)
============================================================ */
const TRACK_PTS = [
  [0, -30, 0], [70, -38, 2], [125, -10, 6], [150, 45, 10], [135, 105, 13],
  [80, 140, 9], [20, 120, 5], [-30, 152, 7], [-95, 158, 11], [-140, 115, 8],
  [-150, 55, 4], [-115, 5, 1], [-60, -15, 0]
].map(p => new THREE.Vector3(p[0], p[2], p[1]));
const curve = new THREE.CatmullRomCurve3(TRACK_PTS, true, 'catmullrom', 0.6);
const N = 720;
const samples = [];
for (let i = 0; i < N; i++) {
  const t = i / N;
  const p = curve.getPointAt(t);
  const tan = curve.getTangentAt(t); tan.normalize();
  const nor = new THREE.Vector3(tan.z, 0, -tan.x).normalize();
  samples.push({ p, tan, nor });
}
const trackLen = curve.getLength();
const SEG_LEN = trackLen / N;
const HALF_W = 7.5;
const LAPS = 3;

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.ClampToEdgeWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* road surface */
const roadTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#3b3e44'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3200; i++) {
    const v = 90 + Math.random() * 70 | 0;
    g.fillStyle = `rgba(${v},${v},${v + 6},${0.05 + Math.random() * 0.08})`;
    g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
  }
  for (let i = 0; i < 40; i++) {
    g.strokeStyle = 'rgba(20,20,22,0.25)'; g.lineWidth = 1;
    g.beginPath();
    const x = Math.random() * w, y = Math.random() * h;
    g.moveTo(x, y); g.lineTo(x + Math.random() * 30 - 15, y + Math.random() * 30 - 15);
    g.stroke();
  }
  g.fillStyle = '#e8e8e8'; g.fillRect(9, 0, 5, h); g.fillRect(w - 14, 0, 5, h);
  g.fillStyle = '#f4f4f4'; g.fillRect(w / 2 - 4, 0, 8, h / 2);
});
(function buildRoad() {
  const verts = [], uvs = [], idx = [];
  for (let i = 0; i <= N; i++) {
    const s = samples[i % N];
    const l = s.p.clone().addScaledVector(s.nor, HALF_W);
    const r = s.p.clone().addScaledVector(s.nor, -HALF_W);
    verts.push(l.x, l.y + 0.03, l.z, r.x, r.y + 0.03, r.z);
    const v = i * SEG_LEN / 9;
    uvs.push(0, v, 1, v);
  }
  for (let i = 0; i < N; i++) {
    const a = i * 2;
    idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const road = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.9, metalness: 0 }));
  road.receiveShadow = true;
  scene.add(road);
})();

/* curbs */
const curbTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#d8302a'; g.fillRect(0, 0, w, h / 2);
  g.fillStyle = '#f2f2f2'; g.fillRect(0, h / 2, w, h / 2);
});
(function buildCurbs() {
  for (const side of [1, -1]) {
    const verts = [], uvs = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const s = samples[i % N];
      const a = s.p.clone().addScaledVector(s.nor, side * HALF_W);
      const b = s.p.clone().addScaledVector(s.nor, side * (HALF_W + 1.4));
      verts.push(a.x, a.y + 0.05, a.z, b.x, b.y + 0.05, b.z);
      const v = i * SEG_LEN / 4;
      uvs.push(0, v, 0.6, v);
    }
    for (let i = 0; i < N; i++) {
      const a = i * 2;
      idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: curbTex, roughness: 0.8, side: THREE.DoubleSide })));
  }
})();

/* barriers */
(function buildWalls() {
  for (const side of [1, -1]) {
    const verts = [], colors = [], idx = [];
    const c1 = new THREE.Color(0xd8302a), c2 = new THREE.Color(0xf2f2f2);
    for (let i = 0; i <= N; i++) {
      const s = samples[i % N];
      const base = s.p.clone().addScaledVector(s.nor, side * (HALF_W + 1.6));
      verts.push(base.x, base.y, base.z, base.x, base.y + 1.0, base.z);
      const col = (Math.floor(i / 6) % 2 === 0) ? c1 : c2;
      colors.push(col.r, col.g, col.b, col.r, col.g, col.b);
    }
    for (let i = 0; i < N; i++) {
      const a = i * 2;
      if (side === 1) idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
      else idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    const wall = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    wall.receiveShadow = true;
    scene.add(wall);
  }
})();

/* ground */
(function buildGround() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#4d8a3d'; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 1100; i++) {
    g.fillStyle = `rgba(${40 + Math.random() * 60 | 0},${100 + Math.random() * 70 | 0},${35 + Math.random() * 40 | 0},0.5)`;
    g.fillRect(Math.random() * 128, Math.random() * 128, 3, 3);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(70, 70);
  tex.colorSpace = THREE.SRGBColorSpace;
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(3000, 3000),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(0, -0.4, 70);
  ground.receiveShadow = true;
  scene.add(ground);
})();

/* start line, gantry, start lights */
const startLights = [];
(function buildStart() {
  const s = samples[0];
  const c = document.createElement('canvas'); c.width = 128; c.height = 32;
  const g = c.getContext('2d');
  for (let x = 0; x < 16; x++) for (let y = 0; y < 4; y++) {
    g.fillStyle = (x + y) % 2 ? '#111' : '#fff';
    g.fillRect(x * 8, y * 8, 8, 8);
  }
  const tex = new THREE.CanvasTexture(c);
  const lineGroup = new THREE.Group();
  lineGroup.position.copy(s.p).setY(s.p.y + 0.06);
  lineGroup.rotation.y = Math.atan2(s.tan.x, s.tan.z);
  const line = new THREE.Mesh(new THREE.PlaneGeometry(HALF_W * 2, 3), new THREE.MeshBasicMaterial({ map: tex }));
  line.rotation.x = -Math.PI / 2;
  lineGroup.add(line);
  scene.add(lineGroup);

  const postMat = new THREE.MeshStandardMaterial({ color: 0x2a3242, roughness: 0.5, metalness: 0.6 });
  const h = Math.atan2(s.tan.x, s.tan.z);
  for (const side of [1, -1]) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 8, 12), postMat);

(function buildTrees() {
  const trunkGeo = new THREE.CylinderGeometry(0.25, 0.4, 2.6, 6);
  const leafGeo = new THREE.ConeGeometry(2.0, 5.0, 8);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 1 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e6b2f, roughness: 1 });
  const positions = [];
  for (let tries = 0; tries < 5000 && positions.length < 260; tries++) {
    const x = (Math.random() - 0.5) * 700;
    const z = 70 + (Math.random() - 0.5) * 700;
    let minD = Infinity;
    for (let i = 0; i < N; i += 4) {
      const dx = samples[i].p.x - x, dz = samples[i].p.z - z;
      const d = dx * dx + dz * dz;
      if (d < minD) minD = d;
    }
    if (minD > 24 * 24 && minD < 320 * 320) positions.push([x, z]);
  }
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, positions.length);
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, positions.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  positions.forEach(([x, z], i) => {
    const s = 0.8 + Math.random() * 1.0;
    sc.set(s, s, s);
    m.compose(new THREE.Vector3(x, 1.3 * s - 0.4, z), q, sc); trunks.setMatrixAt(i, m);
    m.compose(new THREE.Vector3(x, (2.6 + 2.5) * s - 0.4, z), q, sc); leaves.setMatrixAt(i, m);
  });
  trunks.castShadow = leaves.castShadow = true;
  scene.add(trunks); scene.add(leaves);
})();

============================================================ */
function createBike(bodyColor, suitColor, helmetColor) {
  const group = new THREE.Group();
  group.rotation.order = 'YXZ';
  const inner = new THREE.Group();
  group.add(inner);

  const paint = new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.65, roughness: 0.22, envMapIntensity: 1.3 });
  const darkMetal = new THREE.MeshStandardMaterial({ color: 0x1b1d22, metalness: 0.7, roughness: 0.4 });

  const leather = new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.8 });

  const add = (parent, geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.rotation.set(rx, ry, rz);

  function makeWheel() {

/* ============================================================
   RACERS
============================================================ */
const AI_DEF = [
  { name: 'KANE',   body: 0x1e6fff, suit: 0x14213d, helmet: 0xffffff },
  { name: 'DIAZ',   body: 0x00c853, suit: 0x0d3320, helmet: 0x111111 },
  { name: 'VOGEL',  body: 0xffd400, suit: 0x2b2b2b, helmet: 0xffd400 },
  { name: 'OKADA',  body: 0x9c27b0, suit: 0x241033, helmet: 0xe0e0e0 },
  { name: 'MERCER', body: 0x00bcd4, suit: 0x062a30, helmet: 0x222222 }
];
const PLAYER_DEF = { name: 'YOU', body: 0xff6a00, suit: 0x1a1a1a, helmet: 0xffffff };

const racers = [];
function makeRacer(def, isPlayer, slot) {
  const model = createBike(def.body, def.suit, def.helmet);
  scene.add(model.group);
  const b = {
    name: def.name, isPlayer, model, color: def.body,
    pos: new THREE.Vector3(), heading: 0, speed: 0, lean: 0, steer: 0, pitch: 0,
    lateral: 0, fwdDot: 1, nitro: 100, nitroActive: false,
    lap: -1, idx: 0, progress: 0, place: 1,
    finished: false, finishTime: null,
    aiPhase: Math.random() * 20, aiWobble: (Math.random() * 2 - 1) * 2.2,
    maxSpeed: isPlayer ? 54 : 51.5 + Math.random() * 3
  };
  placeOnGrid(b, slot);
  racers.push(b);
  return b;
}

function placeOnGrid(b, slot) {
  const back = 9 + Math.floor(slot / 2) * 5;
  const sIdx = (N - back + N) % N;
  const s = samples[sIdx];
  const lat = slot % 2 === 0 ? 2.4 : -2.4;
  b.pos.copy(s.p).addScaledVector(s.nor, lat);
  b.heading = Math.atan2(s.tan.x, s.tan.z);
  b.idx = sIdx; b.speed = 0; b.lap = -1; b.steer = 0; b.lean = 0; b.pitch = 0;
  b.finished = false; b.finishTime = null; b.nitro = 100;
  updateModel(b, 0);
}

function updateModel(b, dt) {
  b.model.group.position.copy(b.pos);
  b.model.group.rotation.y = b.heading;
  b.model.group.rotation.x = b.pitch;
  b.model.inner.rotation.z = b.lean;
  b.model.rider.rotation.z = b.lean * 0.45;
  b.model.frontGroup.rotation.y = b.steer * 0.22;
  if (dt > 0) {
    const spin = (b.speed / 0.34) * dt;
    b.model.frontWheel.rotation.x += spin;
    b.model.rearWheel.rotation.x += spin;
  }
  const fl = b.model.flame;
  fl.visible = b.nitroActive;
  if (b.nitroActive) {
    const p = 0.7 + Math.random() * 0.6;
    fl.scale.set(p, 0.8 + Math.random() * 0.7, p);
  }
}

/* ============================================================
   PHYSICS
============================================================ */
function groundHeightAt(b) {
  const s0 = samples[b.idx];
  const s1 = samples[(b.idx + 1) % N];
  const rx = b.pos.x - s0.p.x, rz = b.pos.z - s0.p.z;
  const t = THREE.MathUtils.clamp((rx * s0.tan.x + rz * s0.tan.z) / SEG_LEN, -1, 2);
  return s0.p.y + (s1.p.y - s0.p.y) * t;
}

function updateTrackPos(b) {
  let best = b.idx, bd = Infinity;
  for (let k = -24; k <= 24; k++) {
    const i = (b.idx + k + N) % N;
    const s = samples[i];
    const dx = s.p.x - b.pos.x, dz = s.p.z - b.pos.z;
    const d = dx * dx + dz * dz;
    if (d < bd) { bd = d; best = i; }
  }
  const prev = b.idx;
  b.idx = best;
  const s = samples[best];
  const rx = b.pos.x - s.p.x, rz = b.pos.z - s.p.z;
  b.lateral = rx * s.nor.x + rz * s.nor.z;
  b.fwdDot = Math.sin(b.heading) * s.tan.x + Math.cos(b.heading) * s.tan.z;

  if (prev > N * 0.8 && best < N * 0.2 && b.fwdDot > 0) {
    b.lap++;
    onLapCross(b);
  } else if (prev < N * 0.2 && best > N * 0.8 && b.fwdDot < 0) {
    b.lap--;
  }
  b.progress = b.lap * N + best;
}

function stepBike(b, dt, inp) {
  const off = Math.abs(b.lateral) > HALF_W + 1.5;
  let maxSp = b.maxSpeed;
  if (off) maxSp *= 0.45;
  b.nitroActive = false;
  if (inp.nitro && b.nitro > 0) {
    b.nitroActive = true;
    maxSp *= 1.22;
    b.nitro = Math.max(0, b.nitro - 30 * dt);
  } else {
    b.nitro = Math.min(100, b.nitro + 6.5 * dt);
  }

  if (inp.throttle > 0 && b.speed < maxSp) {
    b.speed += 21 * inp.throttle * dt * (1 - b.speed / (maxSp * 1.18));
  }
  if (inp.brake > 0) b.speed -= 34 * inp.brake * dt;
  b.speed -= b.speed * 0.3 * dt;
  if (inp.throttle === 0 && inp.brake === 0) b.speed -= 2.4 * dt;
  if (off) b.speed -= b.speed * 1.15 * dt;
  b.speed = Math.max(0, Math.min(b.speed, maxSp * 1.05));

  const steerRate = 2.5 / (1 + b.speed * 0.03);
  b.steer += (inp.steer - b.steer) * Math.min(1, dt * 9);
  b.heading += b.steer * steerRate * dt * Math.min(1, b.speed / 6);

  const fwd = new THREE.Vector3(Math.sin(b.heading), 0, Math.cos(b.heading));
  b.pos.addScaledVector(fwd, b.speed * dt);

  /* soft boundary keeps bikes inside the barriers */
  const limit = HALF_W + 3.2;
  if (Math.abs(b.lateral) > limit) {
    const excess = Math.abs(b.lateral) - limit;
    const s = samples[b.idx];
    b.pos.addScaledVector(s.nor, -Math.sign(b.lateral) * excess);
    b.speed *= 0.96;
  }

  const leanT = -b.steer * Math.min(1, b.speed / 20) * 0.6;
  b.lean += (leanT - b.lean) * Math.min(1, dt * 6);

  updateTrackPos(b);

  /* height + pitch follow track elevation */
  const y = groundHeightAt(b);
  b.pos.y += (y - b.pos.y) * Math.min(1, dt * 10);
  const slope = (samples[(b.idx + 2) % N].p.y - samples[(b.idx - 2 + N) % N].p.y) / (4 * SEG_LEN);
  b.pitch += ((-Math.atan(slope)) - b.pitch) * Math.min(1, dt * 5);
}

function handleCollisions() {
  for (let i = 0; i < racers.length; i++) {
    for (let j = i + 1; j < racers.length; j++) {
      const a = racers[i], c = racers[j];
      const dx = c.pos.x - a.pos.x, dz = c.pos.z - a.pos.z;
      const d = Math.hypot(dx, dz);
      if (d < 1.7 && d > 0.001) {
        const push = (1.7 - d) / 2;
        const nx = dx / d, nz = dz / d;
        a.pos.x -= nx * push; a.pos.z -= nz * push;
        c.pos.x += nx * push; c.pos.z += nz * push;
        a.speed *= 0.985; c.speed *= 0.985;
      }
    }
  }
}

/* ============================================================
   AI
============================================================ */
function aiInput(b, dt) {
  b.aiPhase += dt;
  const look = 12 + Math.floor(b.speed * 0.55);
  const s = samples[(b.idx + look) % N];

  /* racing line: cut toward the inside of upcoming corners */
  const t1 = samples[b.idx].tan, t2 = samples[(b.idx + 42) % N].tan;
  const cross = t1.x * t2.z - t1.z * t2.x;
  const lineOffset = THREE.MathUtils.clamp(-cross * 26, -3.4, 3.4);
  const wobble = Math.sin(b.aiPhase * 0.21 + b.aiWobble) * 1.6;
  const off = THREE.MathUtils.clamp(lineOffset + wobble, -HALF_W - 1, HALF_W + 1);

  const tx = s.p.x + s.nor.x * off, tz = s.p.z + s.nor.z * off;
  let d = Math.atan2(tx - b.pos.x, tz - b.pos.z) - b.heading;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  const steer = THREE.MathUtils.clamp(d * 2.2, -1, 1);

  const curv = Math.acos(THREE.MathUtils.clamp(t1.dot(t2), -1, 1));
  let targetSpeed = b.maxSpeed * THREE.MathUtils.clamp(1.28 - curv * 1.45, 0.38, 1);
  const gap = player.progress - b.progress;
  targetSpeed *= THREE.MathUtils.clamp(1 + gap * 0.0004, 0.92, 1.1);

  return {
    throttle: b.speed < targetSpeed ? 1 : 0,
    brake: b.speed > targetSpeed * 1.12 ? 0.7 : 0,
    steer,
    nitro: curv < 0.1 && b.nitro > 55 && b.speed > b.maxSpeed * 0.75
  };
}

  if (e.code === 'KeyC') cycleCam();
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'KeyR') resetPlayer();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function readInput() {
  const left = keys['ArrowLeft'] || keys['KeyA'] || touch.left;
  const right = keys['ArrowRight'] || keys['KeyD'] || touch.right;
  input.throttle = (keys['ArrowUp'] || keys['KeyW'] || touch.gas) ? 1 : 0;
  input.brake = (keys['ArrowDown'] || keys['KeyS'] || keys['Space'] || touch.brake) ? 1 : 0;
  input.steer = (left ? 1 : 0) - (right ? 1 : 0);
  input.nitro = !!(keys['ShiftLeft'] || keys['ShiftRight'] || touch.nitro);
  return input;
}

function resetPlayer() {
  if (state !== 'racing') return;
  const s = samples[player.idx];
  player.pos.copy(s.p);
  player.heading = Math.atan2(s.tan.x, s.tan.z);
  player.speed = 0; player.steer = 0; player.lean = 0;
}

if ('ontouchstart' in window) {
  document.getElementById('touchUI').classList.remove('hidden');
  const bind = (id, key) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); touch[key] = true; });
    el.addEventListener('pointerup', () => touch[key] = false);
    el.addEventListener('pointerleave', () => touch[key] = false);
  };
  bind('tLeft', 'left'); bind('tRight', 'right');
  bind('tGas', 'gas'); bind('tBrake', 'brake'); bind('tNitro', 'nitro');
}

/* ============================================================
   AUDIO
============================================================ */
let audioCtx = null, engOsc, engOsc2, engSub, engGain, windGain, muted = false;
function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engOsc = audioCtx.createOscillator(); engOsc.type = 'sawtooth';
    engOsc2 = audioCtx.createOscillator(); engOsc2.type = 'sawtooth';
    engOsc2.detune.value = 12;
    engSub = audioCtx.createOscillator(); engSub.type = 'square';
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 1100; filter.Q.value = 2;
    engGain = audioCtx.createGain(); engGain.gain.value = 0;
    engOsc.connect(filter); engOsc2.connect(filter); engSub.connect(filter);
    filter.connect(engGain); engGain.connect(audioCtx.destination);

    const noiseLen = audioCtx.sampleRate * 2;
    const buf = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < noiseLen; i++) data[i] = Math.random() * 2 - 1;
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf; noise.loop = true;
    const nFilter = audioCtx.createBiquadFilter();
    nFilter.type = 'lowpass'; nFilter.frequency.value = 500;
    windGain = audioCtx.createGain(); windGain.gain.value = 0;
    noise.connect(nFilter); nFilter.connect(windGain); windGain.connect(audioCtx.destination);
    noise.start();
    engOsc.start(); engOsc2.start(); engSub.start();
  } catch (e) { audioCtx = null; }
}
function toggleMute() {
  muted = !muted;
  document.getElementById('muteBtn').innerHTML = muted ? '&#128263; MUTED' : '&#128266; SOUND';
}
function updateAudio() {
  if (!audioCtx) return;
  const sp = player.speed;
  const gear = Math.min(5, Math.floor(sp / 11));
  const inGear = (sp - gear * 11) / 11;
  const f = 55 + inGear * 95 + gear * 14 + (player.nitroActive ? 28 : 0);
  engOsc.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.02);
  engOsc2.frequency.setTargetAtTime(f * 1.005, audioCtx.currentTime, 0.02);
  engSub.frequency.setTargetAtTime(f * 0.5, audioCtx.currentTime, 0.02);
  const active = (state === 'racing' || state === 'countdown') && !paused;
  const g = (muted || !active) ? 0 : 0.04 + (sp / 60) * 0.05 + (input.throttle ? 0.025 : 0);
  engGain.gain.setTargetAtTime(g, audioCtx.currentTime, 0.06);
  windGain.gain.setTargetAtTime((muted || !active) ? 0 : Math.max(0, sp - 20) / 60 * 0.05, audioCtx.currentTime, 0.1);
}

/* ============================================================
   PARTICLES
============================================================ */
const smokeTex = (function () {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 4, 32, 32, 30);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const smokePool = [];
for (let i = 0; i < 60; i++) {
  const mat = new THREE.SpriteMaterial({ map: smokeTex, transparent: true, opacity: 0, depthWrite: false });
  const sp = new THREE.Sprite(mat);
  sp.visible = false;
  scene.add(sp);
  smokePool.push({ sp, life: 0, max: 1, vel: new THREE.Vector3(), grow: 1 });
}
let smokeCursor = 0;
function spawnSmoke(pos, color, size, vel, life) {
  const p = smokePool[smokeCursor];
  smokeCursor = (smokeCursor + 1) % smokePool.length;
  p.sp.visible = true;
  p.sp.position.copy(pos);
  p.sp.material.color.setHex(color);
  p.sp.scale.set(size, size, 1);
  p.vel.copy(vel);
  p.life = life; p.max = life;
  p.grow = size * 1.6;
}
function updateSmoke(dt) {
  for (const p of smokePool) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.sp.visible = false; p.sp.material.opacity = 0; continue; }
    p.sp.position.addScaledVector(p.vel, dt);
    const f = p.life / p.max;
    p.sp.material.opacity = f * 0.45;
    const s = p.sp.scale.x + p.grow * dt;
    p.sp.scale.set(s, s, 1);
  }
}
const tmpV = new THREE.Vector3();
function emitBikeEffects(b, dt) {
  if (b.nitroActive && Math.random() < dt * 40) {
    tmpV.set(0.21, 0.5, -1.0).applyMatrix4(b.model.inner.matrixWorld);
    spawnSmoke(tmpV, 0x66ccff, 0.35, new THREE.Vector3((Math.random() - 0.5) * 0.5, 0.4, (Math.random() - 0.5) * 0.5), 0.4);
  }
  if (Math.abs(b.lateral) > HALF_W + 1.5 && b.speed > 6 && Math.random() < dt * 25) {
    spawnSmoke(b.pos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.6, 0.2, (Math.random() - 0.5) * 0.6)),
      0x9a7d4f, 0.6, new THREE.Vector3((Math.random() - 0.5) * 0.6, 0.9, (Math.random() - 0.5) * 0.6), 0.8);
  }
}

/* ============================================================
   HUD
============================================================ */
const hudEl = document.getElementById('hud');
const posBig = document.getElementById('posBig');
const lapNum = document.getElementById('lapNum');
const timeLine = document.getElementById('timeLine');
const lastLine = document.getElementById('lastLine');
const bestLine = document.getElementById('bestLine');
const centerMsg = document.getElementById('centerMsg');
const cdEl = document.getElementById('countdown');
const wrongWayEl = document.getElementById('wrongWay');
const nitroFill = document.getElementById('nitroFill');
const gearNum = document.getElementById('gearNum');
const spCtx = document.getElementById('speedo').getContext('2d');
const mmCtx = document.getElementById('minimap').getContext('2d');

function fmt(t) {
  if (t == null || !isFinite(t)) return '--:--.---';
  const m = Math.floor(t / 60), s = Math.floor(t % 60), ms = Math.floor((t % 1) * 1000);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(3, '0')}`;
}

function drawSpeedo(kmh) {
  const w = 200, h = 200, cx = 100, cy = 104, r = 76;
  spCtx.clearRect(0, 0, w, h);
  spCtx.beginPath(); spCtx.arc(cx, cy, r + 16, 0, Math.PI * 2);
  spCtx.fillStyle = 'rgba(10,14,22,0.78)'; spCtx.fill();
  spCtx.lineWidth = 2; spCtx.strokeStyle = 'rgba(120,180,255,0.3)'; spCtx.stroke();
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  spCtx.lineWidth = 10; spCtx.lineCap = 'round';
  spCtx.strokeStyle = 'rgba(255,255,255,0.1)';
  spCtx.beginPath(); spCtx.arc(cx, cy, r, a0, a1); spCtx.stroke();
  const frac = Math.min(1, kmh / 280);
  const grad = spCtx.createLinearGradient(0, h, w, 0);
  grad.addColorStop(0, '#33e6ff'); grad.addColorStop(0.6, '#ffd23f'); grad.addColorStop(1, '#ff3b3b');
  spCtx.strokeStyle = grad;
  spCtx.beginPath(); spCtx.arc(cx, cy, r, a0, a0 + (a1 - a0) * frac); spCtx.stroke();
  spCtx.lineWidth = 2; spCtx.strokeStyle = 'rgba(255,255,255,0.4)';
  for (let i = 0; i <= 7; i++) {
    const a = a0 + (a1 - a0) * i / 7;
    spCtx.beginPath();
    spCtx.moveTo(cx + Math.cos(a) * (r - 12), cy + Math.sin(a) * (r - 12));
    spCtx.lineTo(cx + Math.cos(a) * (r - 20), cy + Math.sin(a) * (r - 20));
    spCtx.stroke();
  }
  const na = a0 + (a1 - a0) * frac;
  spCtx.strokeStyle = '#ff3b3b'; spCtx.lineWidth = 4;
  spCtx.beginPath(); spCtx.moveTo(cx, cy);
  spCtx.lineTo(cx + Math.cos(na) * (r - 16), cy + Math.sin(na) * (r - 16));
  spCtx.stroke();
  spCtx.beginPath(); spCtx.arc(cx, cy, 6, 0, Math.PI * 2);
  spCtx.fillStyle = '#fff'; spCtx.fill();
  spCtx.fillStyle = '#fff'; spCtx.font = 'italic 900 30px Arial'; spCtx.textAlign = 'center';
  spCtx.fillText(Math.round(kmh), cx, cy + 46);
  spCtx.font = 'bold 11px Arial'; spCtx.fillStyle = '#8fa3bf';
  spCtx.fillText('KM/H', cx, cy + 62);
}

const mmPts = [];
let mmScale = 1, mmOffX = 0, mmOffY = 0;
(function prepMinimap() {
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const s of samples) {
    minX = Math.min(minX, s.p.x); maxX = Math.max(maxX, s.p.x);
    minZ = Math.min(minZ, s.p.z); maxZ = Math.max(maxZ, s.p.z);
  }
  const size = 190, pad = 16;
  mmScale = (size - pad * 2) / Math.max(maxX - minX, maxZ - minZ);
  mmOffX = (size - (maxX - minX) * mmScale) / 2 - minX * mmScale;
  mmOffY = (size - (maxZ - minZ) * mmScale) / 2 - minZ * mmScale;
  for (let i = 0; i < N; i += 5) {
    mmPts.push([samples[i].p.x * mmScale + mmOffX, samples[i].p.z * mmScale + mmOffY]);
  }
})();
function drawMinimap() {
  mmCtx.clearRect(0, 0, 190, 190);
  mmCtx.beginPath();
  mmCtx.moveTo(mmPts[0][0], mmPts[0][1]);
  for (const p of mmPts) mmCtx.lineTo(p[0], p[1]);
  mmCtx.closePath();
  mmCtx.lineWidth = 9; mmCtx.strokeStyle = 'rgba(20,30,48,0.9)';
  mmCtx.lineJoin = 'round'; mmCtx.stroke();
  mmCtx.lineWidth = 5; mmCtx.strokeStyle = '#4c5b70'; mmCtx.stroke();
  const st = samples[0].p;
  mmCtx.fillStyle = '#fff';
  mmCtx.fillRect(st.x * mmScale + mmOffX - 4, st.z * mmScale + mmOffY - 1.5, 8, 3);
  for (const b of racers) {
    const x = b.pos.x * mmScale + mmOffX, y = b.pos.z * mmScale + mmOffY;
    mmCtx.beginPath(); mmCtx.arc(x, y, b.isPlayer ? 5.5 : 4, 0, Math.PI * 2);
    mmCtx.fillStyle = '#' + new THREE.Color(b.color).getHexString();
    mmCtx.fill();
    if (b.isPlayer) { mmCtx.lineWidth = 2; mmCtx.strokeStyle = '#fff'; mmCtx.stroke(); }
  }
}

let msgTimer = 0;
function showMsg(text, dur = 2) {
  centerMsg.textContent = text;
  centerMsg.style.opacity = 1;
  msgTimer = dur;
}

let playerBest = parseFloat(localStorage.getItem('turboMotoBest')) || null;
let lastLap = null;

function onLapCross(b) {
  if (b.lap >= LAPS && !b.finished) {
    b.finished = true;
    b.finishTime = raceTime;
    if (b.isPlayer) finishRace();
    return;
  }
  if (b.isPlayer && b.lap >= 1) {
    lastLap = raceTime - lapStartTime;
    if (playerBest == null || lastLap < playerBest) {
      playerBest = lastLap;
      localStorage.setItem('turboMotoBest', String(playerBest));
      showMsg('NEW BEST LAP!  ' + fmt(lastLap), 2.5);
    } else {
      showMsg('LAP ' + fmt(lastLap), 2);
    }
  }
  if (b.isPlayer && b.lap === LAPS - 1 && msgTimer <= 0) showMsg('FINAL LAP!', 2);
  if (b.isPlayer) lapStartTime = raceTime;
}

function updateRanking() {
  const sorted = [...racers].sort((a, c) => {
    if (a.finished && c.finished) return a.finishTime - c.finishTime;
    if (a.finished) return -1;
    if (c.finished) return 1;
    return c.progress - a.progress;
  });
  sorted.forEach((b, i) => b.place = i + 1);
}

function updateHUD(dt) {
  posBig.innerHTML = `${player.place}<span>/${racers.length}</span>`;
  lapNum.textContent = Math.min(Math.max(player.lap + 1, 1), LAPS);
  timeLine.textContent = fmt(raceTime);
  lastLine.textContent = 'LAST ' + fmt(lastLap);
  bestLine.textContent = 'BEST ' + fmt(playerBest);
  nitroFill.style.width = player.nitro + '%';
  const sp = player.speed;
  gearNum.textContent = sp < 1 ? 'N' : String(Math.min(6, Math.floor(sp / 11) + 1));
  drawSpeedo(sp * 3.6);
  drawMinimap();
  wrongWayEl.style.display = (player.fwdDot < -0.35 && player.speed > 4) ? 'block' : 'none';
  if (msgTimer > 0) {
    msgTimer -= dt;
    if (msgTimer <= 0) centerMsg.style.opacity = 0;
  }
}

/* ============================================================
   CAMERA
============================================================ */
let camMode = 0;
function cycleCam() { camMode = (camMode + 1) % 3; }
const camPos = new THREE.Vector3();
let menuAngle = 0;
function updateCamera(dt) {
  if (state === 'menu') {
    menuAngle += dt * 0.12;
    camera.position.set(Math.cos(menuAngle) * 180, 60, 70 + Math.sin(menuAngle) * 180);
    camera.lookAt(0, 10, 70);
    camera.fov = 60; camera.updateProjectionMatrix();
    return;
  }
  const b = player;
  const fwd = new THREE.Vector3(Math.sin(b.heading), 0, Math.cos(b.heading));
  if (camMode === 2) {
    camPos.copy(b.pos).addScaledVector(fwd, 0.4).add(new THREE.Vector3(0, 1.45, 0));
    camera.position.copy(camPos);
  } else {
    const dist = camMode === 0 ? 6.8 : 11, hgt = camMode === 0 ? 2.7 : 4.2;
    camPos.copy(b.pos).addScaledVector(fwd, -dist).add(new THREE.Vector3(0, hgt, 0));
    const k = 1 - Math.pow(0.0001, dt);
    camera.position.lerp(camPos, k);
  }
  camera.lookAt(b.pos.clone().addScaledVector(fwd, 8).add(new THREE.Vector3(0, 1.2, 0)));
  const tFov = 68 + (b.speed / b.maxSpeed) * 15 + (b.nitroActive ? 8 : 0);
  camera.fov += (tFov - camera.fov) * Math.min(1, dt * 4);
  camera.updateProjectionMatrix();
}

function updateSun() {
  sun.position.copy(player.pos).add(new THREE.Vector3(60, 110, 40));
  sun.target.position.copy(player.pos);
}

/* ============================================================
   GAME FLOW
============================================================ */
let state = 'menu';
let raceTime = 0, lapStartTime = 0, countdownT = 0, paused = false;

const menuEl = document.getElementById('menu');
const pauseEl = document.getElementById('pauseOverlay');
const finishEl = document.getElementById('finishOverlay');
const resultsEl = document.getElementById('results');
const finishTitle = document.getElementById('finishTitle');

document.getElementById('bestMenu').textContent =
  playerBest ? 'BEST LAP  ' + fmt(playerBest) : '';

document.getElementById('startBtn').addEventListener('click', startRace);
document.getElementById('restartBtn').addEventListener('click', startRace);
document.getElementById('resumeBtn').addEventListener('click', togglePause);
document.getElementById('muteBtn').addEventListener('click', toggleMute);
document.getElementById('camBtn').addEventListener('click', cycleCam);

function startRace() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  menuEl.classList.add('hidden');
  finishEl.classList.add('hidden');
  hudEl.style.display = 'block';
  racers.forEach(b => placeOnGrid(b, racers.indexOf(b)));
  raceTime = 0; lapStartTime = 0; lastLap = null; paused = false;
  countdownT = 3.6;
  cdEl.style.display = 'block';
  state = 'countdown';
}

function togglePause() {
  if (state !== 'racing' && state !== 'countdown') return;
  paused = !paused;
  pauseEl.classList.toggle('hidden', !paused);
}

function finishRace() {
  state = 'finished';
  updateRanking();
  finishTitle.textContent = player.place === 1 ? '\u{1F3C6} YOU WIN!' : `FINISHED  P${player.place}`;
  const sorted = [...racers].sort((a, c) => {
    if (a.finished && c.finished) return a.finishTime - c.finishTime;
    if (a.finished) return -1;
    if (c.finished) return 1;
    return c.progress - a.progress;
  });
  resultsEl.innerHTML = sorted.map((b, i) => {
    let t;
    if (b.finished) t = fmt(b.finishTime);
    else t = '+' + Math.round(Math.abs(player.progress - b.progress) * SEG_LEN) + ' m';
    return `<div class="resRow${b.isPlayer ? ' me' : ''}">
       <span>${i + 1}.&nbsp; ${b.name}</span>
       <span class="t">${t}</span>
     </div>`;
  }).join('');
  setTimeout(() => finishEl.classList.remove('hidden'), 1200);
}

function updateStartLights() {
  const c = Math.ceil(countdownT);
  startLights.forEach((bulb, i) => {
    const em = bulb.material.emissive;
    if (state === 'countdown') {
      if (c >= 1 && i < c) { em.setHex(0xff2020); bulb.material.emissiveIntensity = 2; }
      else { em.setHex(0x00ff40); bulb.material.emissiveIntensity = 2.5; }
    } else {
      em.setHex(0x000000); bulb.material.emissiveIntensity = 0;
    }
  });
}

/* ============================================================
   MAIN LOOP
============================================================ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  let dt = Math.min(clock.getDelta(), 0.05);
  if (paused) dt = 0;

  if (state === 'countdown') {
    countdownT -= dt;
    const c = Math.ceil(countdownT);
    if (c > 0) cdEl.textContent = c;
    else {
      cdEl.textContent = 'GO!';
      if (countdownT < -0.7) { cdEl.style.display = 'none'; state = 'racing'; }
    }
    updateStartLights();
    for (const b of racers) { b.speed = 0; updateModel(b, dt); }
    updateHUD(dt);
  } else if (state === 'racing' || state === 'finished') {
    raceTime += state === 'racing' ? dt : 0;
    for (const b of racers) {
      let inp;
      if (b.isPlayer) {
        inp = state === 'racing' ? readInput() : { throttle: 0, brake: 0.3, steer: 0, nitro: false };
      } else {
        inp = aiInput(b, dt);
      }
      stepBike(b, dt, inp);
    }
    handleCollisions();
    for (const b of racers) { updateModel(b, dt); emitBikeEffects(b, dt); }
    updateSmoke(dt);
    updateRanking();
    updateHUD(dt);
  } else {
    updateStartLights();
  }

  updateCamera(dt > 0 ? dt : 0.016);
  updateSun();
  updateAudio();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
